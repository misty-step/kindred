name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Anonymous loopback only; no cloud credentials or services in CI.
      NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3220
      NEXT_PUBLIC_CONVEX_SITE_URL: http://127.0.0.1:3221
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build vendored Parlor packages
        run: pnpm build:parlor
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Deterministic rules suite
        run: pnpm test
      - name: Build production application
        run: pnpm build:app
