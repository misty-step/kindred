<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Kindred</title>
  <desc id="description">Two overlapping circles with a marigold overlap, centered inside the maskable safe zone.</desc>
  <rect width="512" height="512" fill="#ffffff"/>
  <defs>
    <clipPath id="lens"><circle cx="214" cy="256" r="86"/></clipPath>
  </defs>
  <circle cx="298" cy="256" r="86" fill="#f6c744" clip-path="url(#lens)"/>
  <circle cx="214" cy="256" r="86" fill="none" stroke="#141414" stroke-width="18"/>
  <circle cx="298" cy="256" r="86" fill="none" stroke="#141414" stroke-width="18"/>
</svg>
