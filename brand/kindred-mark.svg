<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Kindred</title>
  <desc id="description">Two overlapping circles; the overlap is filled marigold.</desc>
  <rect width="512" height="512" rx="112" fill="#ffffff"/>
  <defs>
    <clipPath id="lens"><circle cx="196" cy="256" r="118"/></clipPath>
  </defs>
  <circle cx="316" cy="256" r="118" fill="#f6c744" clip-path="url(#lens)"/>
  <circle cx="196" cy="256" r="118" fill="none" stroke="#141414" stroke-width="22"/>
  <circle cx="316" cy="256" r="118" fill="none" stroke="#141414" stroke-width="22"/>
</svg>
