<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title description">
  <title id="title">Kindred</title>
  <desc id="description">The Kindred mark, the name, and two answer tiles that paired: sofa and couch.</desc>
  <rect width="1200" height="630" fill="#ffffff"/>
  <defs>
    <clipPath id="lens"><circle cx="150" cy="170" r="54"/></clipPath>
  </defs>
  <circle cx="205" cy="170" r="54" fill="#f6c744" clip-path="url(#lens)"/>
  <circle cx="150" cy="170" r="54" fill="none" stroke="#141414" stroke-width="10"/>
  <circle cx="205" cy="170" r="54" fill="none" stroke="#141414" stroke-width="10"/>
  <text x="96" y="340" font-family="Newsreader, Georgia, serif" font-weight="700" font-size="128" letter-spacing="-2" fill="#141414">Kindred</text>
  <text x="100" y="420" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="36" fill="#141414">When exactly two of you</text>
  <text x="100" y="468" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="36" fill="#141414">say the same thing, you both score.</text>
  <rect x="720" y="170" width="400" height="140" rx="22" fill="#f6c744"/>
  <text x="820" y="238" text-anchor="middle" font-family="'Libre Franklin', Arial, sans-serif" font-weight="700" font-size="34" fill="#141414">sofa</text>
  <text x="820" y="274" text-anchor="middle" font-family="'Libre Franklin', Arial, sans-serif" font-size="22" fill="#141414">Jo</text>
  <text x="1020" y="238" text-anchor="middle" font-family="'Libre Franklin', Arial, sans-serif" font-weight="700" font-size="34" fill="#141414">couch</text>
  <text x="1020" y="274" text-anchor="middle" font-family="'Libre Franklin', Arial, sans-serif" font-size="22" fill="#141414">Priya</text>
  <rect x="822" y="334" width="196" height="120" rx="18" fill="#ffffff" stroke="#d9d9d2" stroke-width="4"/>
  <text x="920" y="392" text-anchor="middle" font-family="'Libre Franklin', Arial, sans-serif" font-weight="700" font-size="34" fill="#141414">chair</text>
  <text x="920" y="428" text-anchor="middle" font-family="'Libre Franklin', Arial, sans-serif" font-size="22" fill="#5f5f5a">Sam</text>
</svg>
